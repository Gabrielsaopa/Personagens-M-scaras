  biography:
    personalDescription:
      value: '<p>Conquistador espanhol morto-vivo, um kharisiri (sanguessuga imortal). Agarrar (mnbr): segura e prende uma vítima, pronto para sugar a vida dela. Na rodada seguinte, sua boca se prende ao corpo da vítima e começa a sugar gordura, sangue e outros fluidos, devorando 1D10 de FOR, 1D10 de CON, e 1D4 de TAM por rodada até se saciar ou parar (com zero de CON a vítima morre). A vítima pode tentar libertar-se com um teste resistido de FOR. Se sobreviver, recupera FOR e CON à taxa de 1D10 pontos por semana, e 1 de TAM por semana, mas fica com cicatriz hedionda. Armadura: regenera 1 PV por rodada após atingir 0. Só pode ser morto por desmembramento completo ou incineração. Se apenas decapitado, pode se recuperar se encontrar a cabeça e recolocá-la. Se a conexão com o Pai dos Vermes for cortada pela restauração do sigilo, perde a regeneração e desfaz-se à taxa de 1 PV a cada 10 minutos. Regenera 2 PVs por rodada. Feitiços: Contactar Pai dos Vermes (Nyarlathotep). Perda de Sanidade: 0/1D6 por ver na forma monstruosa ou em transformação; nenhuma em forma humana.</p>'
