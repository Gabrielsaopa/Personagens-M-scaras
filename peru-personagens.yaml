      value: '<p>Essas formas ressequidas são os restos das vítimas dos kharisiri, animadas por uma das larvas do deus. Ao contrário do kharisiri, são irracionais. Entrar em corpo (mnbr): uma larva pode entrar no corpo de um alvo através de qualquer orifício ou ferimento, desde que passe pelo menos uma rodada rastejando até o lugar. A gosma que exsuda da larva causa 1 ponto de dano por rodada se entrar em contato com pele nua. Múmias não se esquivam. Armadura: lesões graves causadas contra o tronco causam a perda de um membro; caso contrário, ignorar todo dano exceto na cabeça (um dado de penalidade para atingir a cabeça). Feitiços: nenhum. Perda de Sanidade: 0/1D8 pontos de Sanidade por encontrar uma múmia animada.</p>'
