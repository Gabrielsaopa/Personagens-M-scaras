    personalDescription:
      value: '<p>Embora pareçam entidades vivas, cada uma é na verdade um fragmento da carne do Pai dos Vermes. Tamanho aproximado de um punho humano, massa amorfa de protoplasma branco semelhante a gordura coagulada e rançosa. Cheira a carne podre, é escorregadia e pegajosa. Fluidos cáusticos causam queimaduras (1 ponto de dano por rodada de exposição). Deixam resíduo gorduroso. Fora de um hospedeiro, imediatamente tentam encontrar um novo. Ágeis, deslizam por superfícies e escalam paredes. Entram pela boca ou outros orifícios/ferimentos. Uma vez dentro, secreções param de causar dor mas vítima sente dor intolerável. Hospedeiro recém-infectado precisa de teste Extremo de CON para permanecer consciente. A menos que removida, o hospedeiro se torna um kharisiri. Entrar em corpo (mnbr): não é manobra de combate normal, não sujeita a penalidades por pouco Corpo. Armadura: nenhuma. Feitiços: nenhum. Perda de Sanidade: 0/1D3.</p>'
