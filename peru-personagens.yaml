  biography:
    personalDescription:
      value: '<p>Massa monstruosa e convoluta feita inteiramente de gordura rançosa com vida não natural. Superfície iridescente se contorce com larvas e vermes. Cria pseudópodes instáveis que gotejam fluido branco, ou emana jatos de fluidos de pústulas explosivas. Avatar menor de Nyarlathotep — em grande parte imóvel e sem inteligência sobre-humana. Enquanto os selos da pirâmide permanecerem intactos, está contido. Ataques corpo a corpo: pseudópodes alcançam até 6 metros. Pústulas explosivas: quem estiver dentro de 100 metros sofre 2D10 de dano por queimaduras; cobertura leve não protege, cobertura pesada pode negar ou reduzir à metade. Especial: fedor de decomposição tão avassalador que investigadores em sua presença precisam passar em teste de CON ou são incapacitados por náuseas e vômitos. O Pai dos Vermes não se esquiva. Armadura: nenhuma. Feitiços: nenhum; este avatar idiótico não conta com poder mágico. Perda de Sanidade: 1D6/1D20 pontos de Sanidade.</p>'
